include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**

linter:
  rules:
    - always_declare_return_types
    - directives_ordering
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
